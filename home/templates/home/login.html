<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Office Login - MyDashboard</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login-box {

            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

        }


        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .logo span {

            color: #2563eb;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);

        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            background: #1d4ed8;

        }


        .error {

            background: #fee2e2;

            color: #dc2626;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;

        }


        .notice {

            margin-top: 20px;

            padding: 12px;

            background: #eff6ff;

            color: #1d4ed8;

            border-radius: 8px;

            font-size: 13px;

            text-align: center;

            line-height: 1.5;

        }


        @media (max-width: 500px) {

            .login-box {

                width: calc(100% - 30px);

                padding: 25px;

            }

        }

    </style>

</head>


<body>


    <div class="login-box">


        <!-- Logo -->

        <div class="logo">

            My<span>Dashboard</span>

        </div>


        <p class="subtitle">

            Office User Login

        </p>


        <!-- Error -->

        {% if error %}

            <div class="error">

                {{ error }}

            </div>

        {% endif %}


        <!-- Login Form -->

        <form method="POST">

            {% csrf_token %}


            <label for="username">

                Username

            </label>


            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label for="password">

                Password

            </label>


            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button type="submit">

                Login

            </button>

        </form>


        <div class="notice">

            Office users are created by the administrator.

            <br>

            If you do not have an account,
            contact your administrator.

        </div>


    </div>


</body>

</html>
